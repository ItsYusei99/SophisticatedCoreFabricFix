plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    maven { url = "https://api.modrinth.com/maven" } // Prioridad para Create
    maven {
        url = "https://www.cursemaven.com" // Añadimos el 'www' por si tu DNS lo prefiere
    }
    maven { url = "https://mvn.devos.one/snapshots/" }
    mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"modid" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
    modImplementation "net.fabricmc:fabric-loader:0.14.21"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.85.0+1.20.1"

    // CREATE FABRIC (La versión específica de tu .jar)
    modImplementation "maven.modrinth:create-fabric:6.0.8.1+build.1744-mc1.20.1"

    // SOPHISTICATED CORE FABRIC (De tu captura anterior)
    modImplementation "maven.modrinth:sophisticated-core-(unofficial-fabric-port):1.20.1-1.2.7.15.166"

    // SOPHISTICATED STORAGE FABRIC (De esta captura)
    modImplementation "maven.modrinth:sophisticated-storage-(unofficial-fabric-port):1.20.1-1.3.5.9.136"

    // API necesaria para que los ports funcionen
    modImplementation "maven.modrinth:forge-config-api-port:v8.0.3-1.20.1-Fabric"
}
processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        maven {
            url = "https://cursemaven.com" // Sin el 'www'
        }
        maven {
            url = "https://mvn.devos.one/snapshots/" // Para Create Fabric
        }
        mavenCentral()
    }
}